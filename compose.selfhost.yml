name: ledgerly-selfhost

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - ledgerly_postgres_data:/var/lib/postgresql/data
      - ./selfhost/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ledgerly_backend]

  pgbouncer:
    build:
      context: ./selfhost/pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ledgerly_backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./selfhost/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ledgerly_redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ledgerly_backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ledgerly_object_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    networks: [ledgerly_backend]

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      LEDGERLY_ENVIRONMENT: ${LEDGERLY_ENVIRONMENT:-development}
      LEDGERLY_RUNTIME_MODE: ${LEDGERLY_RUNTIME_MODE:-foundation}
      LEDGERLY_API_HOST: 0.0.0.0
      LEDGERLY_API_PORT: "8788"
      LEDGERLY_DEPENDENCY_TIMEOUT_MS: ${LEDGERLY_DEPENDENCY_TIMEOUT_MS:-1500}
      LEDGERLY_DATABASE_HOST: pgbouncer
      LEDGERLY_DATABASE_PORT: "6432"
      LEDGERLY_DATABASE_NAME: ${POSTGRES_DB}
      LEDGERLY_DATABASE_USER: ${POSTGRES_USER}
      LEDGERLY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      LEDGERLY_DATABASE_POOL_MAX: ${LEDGERLY_DATABASE_POOL_MAX:-20}
      LEDGERLY_DATABASE_IDLE_TIMEOUT_MS: ${LEDGERLY_DATABASE_IDLE_TIMEOUT_MS:-30000}
      LEDGERLY_REDIS_HOST: redis
      LEDGERLY_REDIS_PORT: "6379"
      LEDGERLY_REDIS_PASSWORD: ${REDIS_PASSWORD}
      LEDGERLY_REDIS_DATABASE: ${LEDGERLY_REDIS_DATABASE:-0}
      LEDGERLY_REDIS_NAMESPACE: ${LEDGERLY_REDIS_NAMESPACE:-ledgerly:selfhost}
      LEDGERLY_QUEUE_NAME: ${LEDGERLY_QUEUE_NAME:-core}
      LEDGERLY_QUEUE_MAX_ATTEMPTS: ${LEDGERLY_QUEUE_MAX_ATTEMPTS:-5}
      LEDGERLY_SCHEDULER_ENABLED: ${LEDGERLY_SCHEDULER_ENABLED:-true}
      LEDGERLY_SCHEDULER_POLL_INTERVAL_MS: ${LEDGERLY_SCHEDULER_POLL_INTERVAL_MS:-5000}
      LEDGERLY_SCHEDULER_CLAIM_LIMIT: ${LEDGERLY_SCHEDULER_CLAIM_LIMIT:-20}
      LEDGERLY_SCHEDULER_LOCK_TIMEOUT_MS: ${LEDGERLY_SCHEDULER_LOCK_TIMEOUT_MS:-300000}
      LEDGERLY_SCHEDULER_WORKER_ID: ${LEDGERLY_SCHEDULER_WORKER_ID:-}
      LEDGERLY_JWT_ISSUER: ${LEDGERLY_JWT_ISSUER:-your-finance-pro}
      LEDGERLY_JWT_AUDIENCE: ${LEDGERLY_JWT_AUDIENCE:-your-finance-pro-api}
      LEDGERLY_JWT_SECRET: ${LEDGERLY_JWT_SECRET}
      LEDGERLY_ACCESS_TOKEN_TTL_SECONDS: ${LEDGERLY_ACCESS_TOKEN_TTL_SECONDS:-900}
      LEDGERLY_REFRESH_TOKEN_TTL_DAYS: ${LEDGERLY_REFRESH_TOKEN_TTL_DAYS:-30}
      LEDGERLY_NOTIFICATION_TIMEOUT_MS: ${LEDGERLY_NOTIFICATION_TIMEOUT_MS:-10000}
      LEDGERLY_NOTIFICATION_REQUIRED_CHANNELS: ${LEDGERLY_NOTIFICATION_REQUIRED_CHANNELS:-}
      EGOSMS_API_URL: ${EGOSMS_API_URL:-https://www.egosms.co/api/v1/plain/}
      EGOSMS_USERNAME: ${EGOSMS_USERNAME:-}
      EGOSMS_PASSWORD: ${EGOSMS_PASSWORD:-}
      EGOSMS_SENDER_ID: ${EGOSMS_SENDER_ID:-}
      WHATSAPP_SUPPORT_HUB_URL: ${WHATSAPP_SUPPORT_HUB_URL:-}
      WHATSAPP_SUPPORT_APP_KEY: ${WHATSAPP_SUPPORT_APP_KEY:-}
      LEDGERLY_WHATSAPP_TEMPLATE: ${LEDGERLY_WHATSAPP_TEMPLATE:-general_app_update}
      LEDGERLY_WHATSAPP_LANGUAGE: ${LEDGERLY_WHATSAPP_LANGUAGE:-en_US}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      LEDGERLY_OBJECT_STORAGE_HOST: minio
      LEDGERLY_OBJECT_STORAGE_PORT: "9000"
      LEDGERLY_OBJECT_STORAGE_SSL: ${LEDGERLY_OBJECT_STORAGE_SSL:-false}
      LEDGERLY_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      LEDGERLY_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      LEDGERLY_OBJECT_STORAGE_BUCKET: ${MINIO_DEFAULT_BUCKET:-ledgerly}
      LEDGERLY_OBJECT_STORAGE_REGION: ${MINIO_REGION:-us-east-1}
      LEDGERLY_OBJECT_STORAGE_CREATE_BUCKET: ${LEDGERLY_OBJECT_STORAGE_CREATE_BUCKET:-true}
      LEDGERLY_STORAGE_PATH: /var/lib/ledgerly/storage
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ledgerly_app_storage:/var/lib/ledgerly/storage
    ports:
      - "127.0.0.1:${LEDGERLY_API_PORT:-8788}:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/selfhost/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [ledgerly_backend]

  migrate-d1:
    profiles: ["migration"]
    build:
      context: ./server
    restart: "no"
    command: ["node", "src/migration/cli.mjs", "plan"]
    environment:
      LEDGERLY_DATABASE_HOST: pgbouncer
      LEDGERLY_DATABASE_PORT: "6432"
      LEDGERLY_DATABASE_NAME: ${POSTGRES_DB}
      LEDGERLY_DATABASE_USER: ${POSTGRES_USER}
      LEDGERLY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      LEDGERLY_DATABASE_SSL: "false"
      LEDGERLY_DEPENDENCY_TIMEOUT_MS: ${LEDGERLY_DEPENDENCY_TIMEOUT_MS:-5000}
      LEDGERLY_MIGRATION_DATABASE_POOL_MAX: ${LEDGERLY_MIGRATION_DATABASE_POOL_MAX:-4}
      LEDGERLY_MIGRATION_PHASE: ${LEDGERLY_MIGRATION_PHASE:-auth-core}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      LEDGERLY_D1_MIGRATION_BATCH_SIZE: ${LEDGERLY_D1_MIGRATION_BATCH_SIZE:-250}
      LEDGERLY_D1_MIGRATION_HTTP_TIMEOUT_MS: ${LEDGERLY_D1_MIGRATION_HTTP_TIMEOUT_MS:-15000}
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks: [ledgerly_backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LEDGERLY_SITE_ADDRESS: ${LEDGERLY_SITE_ADDRESS:-http://localhost}
    ports:
      - "${LEDGERLY_HTTP_PORT:-8080}:80"
      - "${LEDGERLY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./selfhost/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ledgerly_caddy_data:/data
      - ledgerly_caddy_config:/config
    networks: [ledgerly_edge, ledgerly_backend]

networks:
  ledgerly_edge:
  ledgerly_backend:
    internal: true

volumes:
  ledgerly_postgres_data:
  ledgerly_redis_data:
  ledgerly_object_data:
  ledgerly_app_storage:
  ledgerly_caddy_data:
  ledgerly_caddy_config:
