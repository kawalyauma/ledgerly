name: ledgerly-selfhost

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - ledgerly_postgres_data:/var/lib/postgresql/data
      - ./selfhost/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ledgerly_backend]

  pgbouncer:
    build:
      context: ./selfhost/pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ledgerly_backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./selfhost/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ledgerly_redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ledgerly_backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ledgerly_object_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    networks: [ledgerly_backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LEDGERLY_SITE_ADDRESS: ${LEDGERLY_SITE_ADDRESS:-http://localhost}
    ports:
      - "${LEDGERLY_HTTP_PORT:-8080}:80"
      - "${LEDGERLY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./selfhost/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ledgerly_caddy_data:/data
      - ledgerly_caddy_config:/config
    networks: [ledgerly_edge, ledgerly_backend]

networks:
  ledgerly_edge:
  ledgerly_backend:
    internal: true

volumes:
  ledgerly_postgres_data:
  ledgerly_redis_data:
  ledgerly_object_data:
  ledgerly_caddy_data:
  ledgerly_caddy_config:
