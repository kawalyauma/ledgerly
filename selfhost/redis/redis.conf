bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

appendonly yes
appendfsync everysec

# Redis will serve both cache and durable job coordination. Never evict queued
# work just to make room for cache entries; application cache writes must cope
# with memory pressure instead.
maxmemory-policy noeviction

save 900 1
save 300 10
save 60 10000

dir /data
