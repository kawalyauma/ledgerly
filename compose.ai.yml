services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ledgerly_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [ledgerly_backend]

  api:
    environment:
      LEDGERLY_AI_ENABLED: ${LEDGERLY_AI_ENABLED:-false}
      LEDGERLY_AI_PROVIDER: ${LEDGERLY_AI_PROVIDER:-ollama}
      LEDGERLY_AI_ENDPOINT: ${LEDGERLY_AI_ENDPOINT:-http://ollama:11434}
      LEDGERLY_AI_MODEL: ${LEDGERLY_AI_MODEL:-}
      LEDGERLY_AI_TIMEOUT_MS: ${LEDGERLY_AI_TIMEOUT_MS:-60000}
      LEDGERLY_AI_CONTEXT_LIMIT: ${LEDGERLY_AI_CONTEXT_LIMIT:-8192}
      LEDGERLY_AI_TEMPERATURE: ${LEDGERLY_AI_TEMPERATURE:-0.2}
      LEDGERLY_AI_TOOL_SUPPORT: ${LEDGERLY_AI_TOOL_SUPPORT:-true}
      LEDGERLY_AI_WORKER_ENABLED: ${LEDGERLY_AI_WORKER_ENABLED:-true}
      LEDGERLY_AI_QUEUE_NAME: ${LEDGERLY_AI_QUEUE_NAME:-ai-workforce}
      LEDGERLY_AI_MAX_CONCURRENCY: ${LEDGERLY_AI_MAX_CONCURRENCY:-2}
      LEDGERLY_AI_MAX_RETRIES: ${LEDGERLY_AI_MAX_RETRIES:-2}
      LEDGERLY_AI_TASK_TIMEOUT_MS: ${LEDGERLY_AI_TASK_TIMEOUT_MS:-120000}
      LEDGERLY_AI_MAX_PROMPT_CHARS: ${LEDGERLY_AI_MAX_PROMPT_CHARS:-48000}
      LEDGERLY_AI_MAX_OUTPUT_CHARS: ${LEDGERLY_AI_MAX_OUTPUT_CHARS:-32000}
      LEDGERLY_AI_MAX_TOOL_CALLS: ${LEDGERLY_AI_MAX_TOOL_CALLS:-12}
      LEDGERLY_AI_MAX_HANDOFFS: ${LEDGERLY_AI_MAX_HANDOFFS:-3}
      LEDGERLY_AI_EMBEDDING_DIMENSIONS: ${LEDGERLY_AI_EMBEDDING_DIMENSIONS:-768}
      LEDGERLY_AI_POLL_INTERVAL_MS: ${LEDGERLY_AI_POLL_INTERVAL_MS:-500}
      LEDGERLY_AI_MAX_KNOWLEDGE_BYTES: ${LEDGERLY_AI_MAX_KNOWLEDGE_BYTES:-26214400}
      LEDGERLY_AI_CHUNK_CHARS: ${LEDGERLY_AI_CHUNK_CHARS:-3200}
      LEDGERLY_AI_CHUNK_OVERLAP_CHARS: ${LEDGERLY_AI_CHUNK_OVERLAP_CHARS:-400}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ledgerly_ollama_data:
