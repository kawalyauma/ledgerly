services:
  nvr-mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.21.0}
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./camera-server/mediamtx.yml:/mediamtx.yml:ro
      - ${CAMERA_STORAGE_ROOT:-./camera-storage}:/recordings
    command: ["/mediamtx.yml"]
    ports:
      - "127.0.0.1:${CAMERA_RTSP_HOST_PORT:-8554}:8554"
      - "127.0.0.1:${CAMERA_HLS_HOST_PORT:-8888}:8888"
      - "127.0.0.1:${CAMERA_WEBRTC_HTTP_HOST_PORT:-8889}:8889"
      - "${CAMERA_WEBRTC_UDP_PORT:-8189}:8189/udp"
    security_opt:
      - no-new-privileges:true
    networks: [ledgerly_edge, ledgerly_backend]

# Production backups are intentionally host-orchestrated by
# selfhost/backups/backup-all.sh and the ledgerly-backup systemd timer. The old
# Compose backup profile was removed because the verified pipeline needs host
# Docker access to snapshot PostgreSQL, MinIO and safe configuration as one set.

networks:
  ledgerly_edge:
    external: false
  ledgerly_backend:
    internal: true
