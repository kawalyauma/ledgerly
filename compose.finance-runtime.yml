# Finance/runtime overlay intentionally does not own the NVR media service.
# Run camera-server/docker-compose.yml + ledgerly-camera.service independently so
# PostgreSQL, API, Printerly, finance, or Redis failure cannot interrupt recording.
services:
  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_ROOT: /backups
    volumes:
      - ./selfhost/backups:/opt/ledgerly-backup:ro
      - ${LEDGERLY_BACKUP_HOST_PATH:-./backups}:/backups
    entrypoint: ["/bin/sh","/opt/ledgerly-backup/backup-postgres.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ledgerly_backend]

networks:
  ledgerly_backend:
    external: false
