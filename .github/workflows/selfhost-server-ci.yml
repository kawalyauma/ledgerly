name: Self-hosted Server CI

on:
  push:
    branches:
      - main
      - "selfhost-*"
      - "selfhost/**"
    paths:
      - "server/**"
      - "selfhost/**"
      - "camera-server/mediamtx.yml"
      - "compose.selfhost.yml"
      - "compose.finance-runtime.yml"
      - ".env.selfhost.example"
      - ".github/workflows/selfhost-server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "selfhost/**"
      - "camera-server/mediamtx.yml"
      - "compose.selfhost.yml"
      - "compose.finance-runtime.yml"
      - ".env.selfhost.example"
      - ".github/workflows/selfhost-server-ci.yml"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  operations-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-production validation environment
        run: |
          cp .env.selfhost.example /tmp/ledgerly.env
          sed -E -i 's/CHANGE_ME_[A-Za-z0-9_]+/ci-validation-secret-0123456789abcdef/g' /tmp/ledgerly.env
          chmod 600 /tmp/ledgerly.env
          mkdir -p /tmp/ledgerly-backups
      - name: Validate base, module-cutover and finance/NVR Compose configuration
        run: docker compose --env-file /tmp/ledgerly.env -f compose.selfhost.yml -f selfhost/ops/compose-module-cutovers.yml -f compose.finance-runtime.yml config --quiet
      - name: Run safe operations production-readiness checks
        env:
          LEDGERLY_ENV_FILE: /tmp/ledgerly.env
          LEDGERLY_BACKUP_ENV_FILE: /tmp/ledgerly-no-backup-env
          BACKUP_ROOT: /tmp/ledgerly-backups
          OPS_LIVE_TESTS: "false"
        run: selfhost/ops/validate-production.sh
