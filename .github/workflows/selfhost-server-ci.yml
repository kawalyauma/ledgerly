name: Self-hosted Server CI

on:
  push:
    branches:
      - main
      - "selfhost-*"
      - "selfhost/**"
    paths:
      - "server/**"
      - "selfhost/**"
      - "compose.selfhost.yml"
      - ".env.selfhost.example"
      - ".github/workflows/selfhost-server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "selfhost/**"
      - "compose.selfhost.yml"
      - ".env.selfhost.example"
      - ".github/workflows/selfhost-server-ci.yml"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledgerly_test
          POSTGRES_USER: ledgerly_test
          POSTGRES_PASSWORD: ledgerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerly_test -d ledgerly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGERLY_TEST_DATABASE_URL: postgres://ledgerly_test:ledgerly_test@127.0.0.1:5432/ledgerly_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-hosted compose configuration
        run: docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
