name: School mobile staging check
on:
  push:
    branches:
      - chatgpt/mobile-school-management-20260908
jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: attendance-mobile
        run: npm ci
      - name: Typecheck Ledgerly Mobile
        working-directory: attendance-mobile
        run: npm run typecheck
